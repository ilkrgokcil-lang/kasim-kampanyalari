:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: one brand per screen, a phone in the middle, campaign switch pinned to the bottom like an app tab bar. Single dark "stage" look on purpose. */
:root{
  --stage:#121315;
  --stage-2:#1b1c1f;
  --ink:#f3f1ee;
  --muted:#9a9894;
  --line:rgba(243,241,238,.14);
  --chip:#f3f1ee;
  --chip-ink:#121315;
  --bezel:#2a2b2e;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --pw:min(76vw,340px,calc((100svh - 150px) * .47));
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-snap-type:y proximity;scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{background:var(--stage);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--stage)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px;background:linear-gradient(var(--stage) 55%,transparent);font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.top b{color:var(--ink);font-weight:500}
.top .count{font-variant-numeric:tabular-nums}

/* ---------- cover ---------- */
.cover{scroll-snap-align:start;padding-block:8px 120px;display:flex;flex-direction:column;gap:28px;max-width:720px;margin:0 auto}
.kicker{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.cover h1{margin:0;font-family:var(--f-display);font-weight:900;text-transform:uppercase;line-height:.86;font-size:clamp(64px,22vw,148px);letter-spacing:-.01em;text-wrap:balance}
.cover h1 .amp{display:block;font-size:.42em;line-height:1.1;color:var(--muted);font-weight:700;letter-spacing:.02em}
.lead{margin:0;max-width:44ch;color:var(--muted);font-size:16px}
.lead strong{color:var(--ink);font-weight:600}
.facts{display:flex;flex-wrap:wrap;gap:8px 20px;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.facts span b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
.index{display:grid;grid-auto-flow:column;grid-auto-columns:clamp(72px,21vw,104px);gap:8px;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;scroll-padding-inline:max(16px,env(safe-area-inset-left,0px));padding-bottom:4px;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.index::-webkit-scrollbar{display:none}
.index a{scroll-snap-align:start}
.index a{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:var(--ink)}
.index img{width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:8px;display:block;background:var(--stage-2);transition:transform .25s}
.index a:hover img{transform:translateY(-3px)}
.index a:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:8px}
.index span{font-family:var(--f-mono);font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hint{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.hint i{display:inline-block;width:1px;height:22px;background:var(--muted);animation:drip 1.6s ease-in-out infinite}
@keyframes drip{0%{transform:scaleY(.2);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}100%{transform:scaleY(.2);transform-origin:bottom}}

/* ---------- brand section ---------- */
.brand{scroll-snap-align:start;min-height:100svh;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding-block:44px 84px;isolation:isolate}
.brand::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(60% 46% at 50% 52%,var(--tint) 0%,transparent 72%);opacity:.55;transition:background .5s}
.bhead{width:var(--pw);display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.bhead h2{margin:0;font-family:var(--f-display);font-weight:900;text-transform:uppercase;font-size:clamp(30px,9vw,40px);line-height:.95;letter-spacing:.005em;min-width:0}
.bhead .no{font-family:var(--f-mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}

/* phone */
.phone{width:var(--pw);max-width:100%;padding:calc(var(--pw) * .035);border-radius:calc(var(--pw) * .16);background:linear-gradient(145deg,#3a3b3f,var(--bezel) 40%,#1d1e20);box-shadow:0 0 0 1px rgba(255,255,255,.06) inset,0 30px 60px -20px rgba(0,0,0,.7),0 12px 24px -12px rgba(0,0,0,.5);position:relative}
.phone::before,.phone::after{content:"";position:absolute;width:3px;background:#2f3033;border-radius:2px}
.phone::before{left:-2px;top:22%;height:9%}
.phone::after{right:-2px;top:26%;height:14%}
.screen{border-radius:calc(var(--pw) * .13);overflow:hidden;background:#000;position:relative}
.sbar{height:calc(var(--pw) * .115);display:flex;align-items:center;justify-content:space-between;padding:0 calc(var(--pw) * .085);font-family:var(--f-body);font-weight:600;font-size:calc(var(--pw) * .042);color:#fff;position:relative}
.island{position:absolute;left:50%;top:calc(var(--pw) * .028);transform:translateX(-50%);width:30%;height:calc(var(--pw) * .07);background:#000;border-radius:99px;box-shadow:0 0 0 1px #111}
.sicons{display:flex;gap:4px;align-items:center}
.sicons svg{height:calc(var(--pw) * .036);width:auto;fill:#fff}
.slides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.slides::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;aspect-ratio:750/1340;position:relative}
.slide img,.slide video{width:100%;height:100%;object-fit:cover;display:block}
.slide.is-video,.slide.is-fit{background:#000}
.slide.is-video video,.slide.is-fit img{object-fit:contain}

.homebar{height:calc(var(--pw) * .07);display:flex;align-items:center;justify-content:center}
.homebar i{width:34%;height:4px;border-radius:4px;background:#fff;opacity:.9}

/* caption + local switch */
.cap{width:var(--pw);max-width:100%;display:flex;flex-direction:column;gap:10px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tabs button{appearance:none;border:1px solid var(--line);background:transparent;color:var(--muted);font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:9px 6px;border-radius:99px;cursor:pointer;transition:background .2s,color .2s}
.tabs button[aria-pressed="true"]{background:var(--chip);color:var(--chip-ink);border-color:var(--chip)}
.tabs button:disabled{opacity:.4;cursor:default;text-decoration:line-through}
.tabs button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.offer{margin:0;font-size:13px;color:var(--ink);min-height:1.5em;text-align:left;min-width:0}
.dots{display:flex;gap:6px;flex:none}.dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--ink)}
.cap{flex-direction:row!important;align-items:center;justify-content:space-between;gap:12px!important}
.offer small{display:block;margin-top:2px;font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* ---------- global switch (bottom) ---------- */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:center;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 14px);padding-top:28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:linear-gradient(transparent,var(--stage) 60%);pointer-events:none}
.seg{pointer-events:auto;display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:99px;background:var(--stage-2);border:1px solid var(--line);width:min(100%,320px);box-shadow:0 10px 30px -10px rgba(0,0,0,.8)}
.seg button{white-space:nowrap;appearance:none;border:0;background:transparent;color:var(--muted);font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:.04em;text-transform:uppercase;padding:9px 10px 8px;border-radius:99px;cursor:pointer;transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:var(--chip);color:var(--chip-ink)}
.seg button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* ---------- desktop QR ---------- */
.qr{display:none}
@media (min-width:1000px) and (min-height:620px){
  .qr{display:flex;position:fixed;right:max(24px,env(safe-area-inset-right,0px));bottom:24px;z-index:7;flex-direction:column;gap:10px;align-items:center;padding:14px 14px 12px;background:var(--ink);color:var(--chip-ink);border-radius:16px;width:168px;box-shadow:0 20px 40px -16px rgba(0,0,0,.8)}
  .qr svg{width:140px;height:140px;display:block}
  .qr p{margin:0;font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;text-align:center;line-height:1.35}
}
.foot{scroll-snap-align:end;padding-block:24px 120px;text-align:center;font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.foot a{color:var(--ink)}
/* ---------- videos ---------- */
.slide.is-video{overflow:hidden}
.slide.is-video::before{content:"";position:absolute;inset:-24px;background:var(--poster) center/cover;filter:blur(22px) brightness(.45) saturate(1.2)}
.slide.is-video video{position:relative}
.snd{position:absolute;right:10px;bottom:10px;width:38px;height:38px;border-radius:50%;border:0;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;cursor:pointer;padding:0}
.snd svg{width:20px;height:20px;fill:#fff;stroke:#fff}
.snd[aria-pressed="true"]{background:#f3f1ee}.snd[aria-pressed="true"] svg{fill:#121315;stroke:#121315}
.snd:focus-visible{outline:2px solid #fff;outline-offset:2px}
.videos{--pw:min(72vw,320px,calc((100svh - 200px) * .47));scroll-snap-align:start;min-height:100svh;display:flex;flex-direction:column;justify-content:center;gap:14px;padding-block:44px 96px;position:relative;isolation:isolate}
.videos::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(70% 46% at 50% 52%,#3a3b40 0%,transparent 72%);opacity:.55}
.vhead{width:var(--pw);max-width:calc(100% - 32px);margin-inline:auto;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.vhead h2{margin:0;font-family:var(--f-display);font-weight:900;text-transform:uppercase;font-size:clamp(30px,9vw,40px);line-height:.95}
.vhead span{font-family:var(--f-mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.vtrack{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain;padding-inline:calc(50% - var(--pw) / 2);padding-block:4px 6px}
.vtrack::-webkit-scrollbar{display:none}
.vcard{flex:none;width:var(--pw);scroll-snap-align:center;display:flex;flex-direction:column;gap:10px}
.vcard .slide{flex:none;width:100%}
.vcap{display:flex;flex-direction:column;gap:2px;font-size:13px}
.vcap b{font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:.03em;text-transform:uppercase}
.vcap span{color:var(--muted);min-width:0}
.vnav{display:flex;gap:6px;align-items:center}
.vnav button{appearance:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--ink);font-size:16px;cursor:pointer;display:grid;place-items:center}
.vnav button:hover{background:var(--stage-2)}
.vnav button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.vnav span{margin-right:6px;white-space:nowrap}
.index a.vlink span::before{content:"▶ ";font-size:8px;vertical-align:1px}
</style>

</head>
<body>
<header class="top wrap" aria-label="Sunum durumu">
  <span><b>Kasım '26</b> · Mobil</span>
  <span class="count" id="where">Kapak</span>
</header>

<section class="cover wrap" id="kapak">
  <div class="kicker">Kampanya görselleri · Mobil hero</div>
  <h1>11.11<span class="amp">ve</span><span lang="en">Black Friday</span></h1>
  <div class="facts" id="facts"></div>
  <nav class="index" id="index" aria-label="Markalar"></nav>
  <div class="hint"><i></i>Kaydır</div>
</section>

<main id="brands"></main>

<section class="videos" id="videolar" aria-label="Videolar">
  <div class="vhead"><h2>Videolar</h2><div class="vnav"><span id="vcount"></span><button type="button" id="vprev" aria-label="Önceki video">←</button><button type="button" id="vnext" aria-label="Sonraki video">→</button></div></div>
  <div class="vtrack" id="vtrack" tabindex="0"></div>
</section>

<footer class="foot wrap">Son · <a href="#kapak">Başa dön</a></footer>

<div class="dock" aria-label="Kampanya seçimi">
  <div class="seg" role="group">
    <button type="button" id="g1111" aria-pressed="true">11.11</button>
    <button type="button" id="gbf" aria-pressed="false" lang="en">Black Friday</button>
  </div>
</div>

<aside class="qr" id="qr" aria-label="Telefonda aç" hidden>
  <div id="qrcode"></div>
  <p>Telefonunla okut,<br>kendi ekranında gez</p>
</aside>

<script>
const BRANDS=[
 {id:"superstep",name:"SUPERSTEP",tint:"#7a4a50",c:{"1111":"11.11 · Sepette %50'ye varan",bf:"Black Friday · %50'ye varan"}},
 {id:"fashfed",name:"FASHFED",tint:"#7a4a2a",c:{"1111":"Ayrıcalıklı Kasım · %40'a varan",bf:"Black Friday · %50'ye varan"}},
 {id:"lacoste",name:"LACOSTE",tint:"#1f5a38",c:{"1111":"Seçili ürünlerde %11",bf:"Croco Friday · 2 ve üzeri %20"}},
 {id:"heartbeat",name:"HEARTBEAT",tint:"#4f6688",c:{"1111":"11.11 · Sepette %50'ye varan",bf:"Black Friday · %50'ye varan"}},
 {id:"houseofsuperstep",name:"HOUSE OF SUPERSTEP",tint:"#5a2a34",c:{"1111":"11.11 · Sepette %50'ye varan",bf:"Black Friday · %50'ye varan"}},
 {id:"nautica",name:"NAUTICA",tint:"#6b5450",c:{"1111":"11.11 · %30'a varan",bf:"Black Week · %30'a varan"}},
 {id:"gant",name:"GANT",tint:"#7a1a2c",c:{"1111":"11.11 · Sepette %20",bf:"Black Week · Sepette %20"}},
 {id:"converse",name:"CONVERSE",tint:"#5a5650",c:{"1111":"Singles' Day · %11 indirim",bf:"Black Friday · %20 indirim"}},
 {id:"intersport",name:"INTERSPORT",tint:"#5a1a22",fit:["1111","bf"],c:{"1111":"11.11 · Sepette %50'ye varan",bf:"Black Friday · %50'ye varan"}},
 {id:"superkids",name:"SUPERKIDS",tint:"#8a6a20",c:{"1111":"11.11 · Sepette %50'ye varan",bf:"Black Friday · %50'ye varan"}},
 {id:"occasion",name:"OCCASION",tint:"#6a2420",c:{"1111":"Kasım Festivali · %70'e varan"}}
];
// Videos sit together at the end, in VORDER brand order, then campaign.
const VIDEOS=[
 {brand:"converse",k:"1111",file:"v_converse_1111",c:"Singles' Day"},
 {brand:"fashfed",k:"1111",file:"v_fashfed_1111_teaser",c:"Geri sayım teaser"},
 {brand:"fashfed",k:"1111",file:"v_fashfed_1111",c:"%40'a varan indirim"},
 {brand:"gant",k:"bf",file:"v_gant_bf",c:"%30'a varan indirim"},
 {brand:"intersport",k:"1111",file:"v_intersport_1111_mobil",c:"Sepette %50'ye varan"},
 {brand:"intersport",k:"1111",file:"v_intersport_1111_yatay",c:"6 Kasım duyurusu"},
 {brand:"lacoste",k:"1111",file:"v_lacoste_1111_teaser",c:"Singles' Day teaser"},
 {brand:"lacoste",k:"bf",file:"v_lacoste_bf",c:"Croco Friday · net %20"},
 {brand:"nautica",k:"1111",file:"v_nautica_1111",c:"%30'a varan indirim"},
 {brand:"nautica",k:"bf",file:"v_nautica_bf",c:"Black Week"},
 {brand:"occasion",k:"1111",file:"v_occasion_1111",c:"Kasım Festivali · %70'e varan"},
 {brand:"superstep",k:"1111",file:"v_superstep_1111_teaser1",c:"Geri sayım teaser"},
 {brand:"superstep",k:"1111",file:"v_superstep_1111_teaser2",c:"6 Kasım teaser"},
 {brand:"superstep",k:"1111",file:"v_superstep_1111",c:"%50'ye varan indirim"}
];
const SND_OFF='<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9l5 6M22 9l-5 6" stroke-width="2" stroke-linecap="round" fill="none"/></svg>';
const SND_ON='<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" stroke-width="2" stroke-linecap="round" fill="none"/></svg>';
const LABEL={"1111":"11.11",bf:"Black Friday"};
const KEYS=["1111","bf"];
const pad=n=>String(n).padStart(2,"0");
const icons='<span class="sicons"><svg viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg><svg viewBox="0 0 26 12"><rect x=".5" y=".5" width="22" height="11" rx="3" fill="none" stroke="#fff" stroke-opacity=".5"/><rect x="2" y="2" width="16" height="8" rx="1.8"/><rect x="23.5" y="4" width="1.8" height="4" rx=".9" opacity=".5"/></svg></span>';

const idx=document.getElementById("index"), main=document.getElementById("brands");
const BORDER=Object.fromEntries(BRANDS.map((b,i)=>[b.id,i]));
const VORDER=["superstep","fashfed","lacoste","nautica","gant","converse","intersport","occasion"];
const vo=id=>{const i=VORDER.indexOf(id);return i<0?99:i;};
VIDEOS.sort((x,y)=>(vo(x.brand)-vo(y.brand))||(KEYS.indexOf(x.k)-KEYS.indexOf(y.k)));
const hasVideo=(id,k)=>VIDEOS.some(v=>v.brand===id&&v.k===k);
let imgCount=0;
BRANDS.forEach((b,i)=>{
  const keys=KEYS.filter(k=>b.c[k]);imgCount+=keys.filter(k=>!(b.video&&b.video.includes(k))).length;
  const a=document.createElement("a");a.href="#"+b.id;
  a.innerHTML=`<img src="img/${b.id}_${keys[0]}.jpg" alt="${b.name} ${LABEL[keys[0]]} görseli" loading="lazy"><span lang="en">${b.name}</span>`;
  idx.appendChild(a);
  const notes=KEYS.filter(k=>!b.c[k]).map(k=>hasVideo(b.id,k)?`${LABEL[k]} videosu en sonda`:`${LABEL[k]} görseli yok`);
  const s=document.createElement("section");s.className="brand wrap";s.id=b.id;s.style.setProperty("--tint",b.tint);s.dataset.i=i;
  s.innerHTML=`
   <div class="bhead"><h2 lang="en">${b.name}</h2></div>
   <div class="phone"><div class="screen">
     <div class="sbar"><span>11:11</span><span class="island"></span>${icons}</div>
     <div class="slides" tabindex="0" aria-label="${b.name} görselleri">${keys.map(k=>`<div style="--poster:url(img/${b.id}_${k}.jpg)" class="slide${b.video&&b.video.includes(k)?" is-video":""}${b.fit&&b.fit.includes(k)?" is-fit":""}" data-k="${k}">${b.video&&b.video.includes(k)?`<video src="img/${b.id}_${k}.mp4" poster="img/${b.id}_${k}.jpg" muted loop playsinline preload="none" aria-label="${b.name} ${LABEL[k]} videosu"></video>`:`<img src="img/${b.id}_${k}.jpg" alt="${b.name} ${LABEL[k]} mobil görseli" loading="${i<2?"eager":"lazy"}" decoding="async">`}</div>`).join("")}</div>
     <div class="homebar"><i></i></div>
   </div></div>
   <div class="cap">
     <p class="offer"></p>
     <div class="dots" aria-hidden="true" ${keys.length<2?"hidden":""}>${keys.map((k,j)=>`<i data-k="${k}" class="${j?"":"on"}"></i>`).join("")}</div>
   </div>`;
  main.appendChild(s);

  const slides=s.querySelector(".slides"), tabs=s.querySelectorAll(".dots i");
  const mark=k=>{tabs.forEach(t=>t.classList.toggle("on",t.dataset.k===k));};
  s._go=(k,smooth=true)=>{const el=slides.querySelector(`[data-k="${k}"]`);if(!el)return;slides.scrollTo({left:el.offsetLeft,behavior:smooth?"smooth":"auto"});mark(k);};
  let raf;slides.addEventListener("scroll",()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>{const n=Math.round(slides.scrollLeft/slides.clientWidth);const k=keys[n];if(k)mark(k);});},{passive:true});
});

// videos section
const vtrack=document.getElementById("vtrack");
VIDEOS.forEach(v=>{
  const b=BRANDS[BORDER[v.brand]];
  const c=document.createElement("figure");c.className="vcard";c.dataset.k=v.k;c.style.margin="0";
  c.innerHTML=`<div class="phone"><div class="screen">
     <div class="sbar"><span>11:11</span><span class="island"></span>${icons}</div>
     <div class="slide is-video" style="--poster:url(img/${v.file}.jpg)"><video src="img/${v.file}.mp4" poster="img/${v.file}.jpg" muted loop playsinline preload="none" aria-label="${b.name} ${LABEL[v.k]} videosu"></video><button type="button" class="snd" aria-pressed="false" aria-label="Sesi aç">${SND_OFF}</button></div>
     <div class="homebar"><i></i></div></div></div>
   <figcaption class="vcap"><b lang="en">${b.name}</b>${/teaser/i.test(v.file)?'<span lang="en">Teaser</span>':""}</figcaption>`;
  vtrack.appendChild(c);
});
document.getElementById("vcount").textContent=`${VIDEOS.length} video`;
if(VIDEOS.length){const a=document.createElement("a");a.href="#videolar";a.className="vlink";a.innerHTML=`<img src="img/${VIDEOS[0].file}.jpg" alt="Videolar" loading="lazy"><span>Videolar</span>`;idx.appendChild(a);}
else document.getElementById("videolar").hidden=true;
document.getElementById("facts").innerHTML=`<span><b>${BRANDS.length}</b> marka</span><span><b>${imgCount}</b> görsel</span><span><b>${VIDEOS.length}</b> video</span><span><b>2</b> kampanya</span>`;

// arrows
const vstep=d=>{const cards=[...vtrack.children];const mid=vtrack.scrollLeft+vtrack.clientWidth/2;let i=cards.findIndex(c=>c.offsetLeft+c.clientWidth>mid);if(i<0)i=0;const t=cards[Math.max(0,Math.min(cards.length-1,i+d))];vtrack.scrollTo({left:t.offsetLeft-(vtrack.clientWidth-t.clientWidth)/2,behavior:"smooth"});};
document.getElementById("vprev").addEventListener("click",()=>vstep(-1));
document.getElementById("vnext").addEventListener("click",()=>vstep(1));

// sound: one video at a time
vtrack.addEventListener("click",e=>{const btn=e.target.closest(".snd");if(!btn)return;const v=btn.parentElement.querySelector("video");const on=v.muted;
  vtrack.querySelectorAll(".snd").forEach(o=>{const ov=o.parentElement.querySelector("video");ov.muted=true;o.setAttribute("aria-pressed","false");o.setAttribute("aria-label","Sesi aç");o.innerHTML=SND_OFF;});
  if(on){v.muted=false;btn.setAttribute("aria-pressed","true");btn.setAttribute("aria-label","Sesi kapat");btn.innerHTML=SND_ON;const p=v.play();if(p&&p.catch)p.catch(()=>{});}});

// play videos only while their section is on screen
const vio=new IntersectionObserver(es=>es.forEach(e=>{const v=e.target;if(e.isIntersecting){const p=v.play();if(p&&p.catch)p.catch(()=>{});}else{v.pause();if(!v.muted){v.muted=true;const btn=v.parentElement.querySelector(".snd");if(btn){btn.setAttribute("aria-pressed","false");btn.innerHTML=SND_OFF;}}}}),{threshold:.6});
document.querySelectorAll("video").forEach(v=>{v.muted=true;vio.observe(v);});
// a video that leaves the screen goes quiet again

// global switch
const g={"1111":document.getElementById("g1111"),bf:document.getElementById("gbf")};
function setAll(k){Object.entries(g).forEach(([kk,el])=>el.setAttribute("aria-pressed",kk===k));document.querySelectorAll(".brand").forEach(s=>s._go(k));const fv=vtrack.querySelector(`.vcard[data-k="${k}"]`);if(fv)vtrack.scrollTo({left:fv.offsetLeft-(vtrack.clientWidth-fv.clientWidth)/2,behavior:"smooth"});}
g["1111"].addEventListener("click",()=>setAll("1111"));
g.bf.addEventListener("click",()=>setAll("bf"));

// where am I
const where=document.getElementById("where");
const io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){const t=e.target;where.textContent=t.id==="kapak"?"Kapak":t.id==="videolar"?"Videolar":`${pad(+t.dataset.i+1)} / ${pad(BRANDS.length)}`;}});},{threshold:.55});
io.observe(document.getElementById("kapak"));document.querySelectorAll(".brand,#videolar").forEach(s=>io.observe(s));

// desktop QR (filled in when the share link is known)
if(matchMedia("(min-width:1000px)").matches){const sc=document.createElement("script");sc.src="js/qrcode.js";sc.async=true;sc.onload=()=>{try{const q=qrcode(0,"M");q.addData(location.href.split("#")[0]);q.make();document.getElementById("qrcode").innerHTML=q.createSvgTag({cellSize:4,margin:0,scalable:true});document.getElementById("qr").hidden=false;}catch(e){}};document.head.appendChild(sc);}
</script>

</body>
</html>
